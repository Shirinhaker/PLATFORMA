name: production-quality-gates

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: koprik
          POSTGRES_PASSWORD: koprik
          POSTGRES_DB: koprik
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koprik -d koprik"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      KOPRIK_ENVIRONMENT: test
      KOPRIK_DATABASE_URL: postgresql+asyncpg://koprik:koprik@localhost:5432/koprik
      KOPRIK_TEST_DATABASE_URL: postgresql+asyncpg://koprik:koprik@localhost:5432/koprik
      KOPRIK_REDIS_URL: redis://localhost:6379/0
      KOPRIK_OTP_SECRET: ci-otp-secret
      KOPRIK_ADMIN_OTP_SECRET: ci-admin-otp-secret
      KOPRIK_CSRF_SECRET: ci-csrf-secret
      KOPRIK_TELEGRAM_WEBHOOK_SECRET: ci-webhook-secret
      KOPRIK_OUTBOX_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v6

      - name: Install backend from lock
        working-directory: backend
        run: uv sync --frozen --extra test

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Apply database migrations
        working-directory: backend
        run: uv run python -m alembic upgrade head

      - name: Lint backend
        working-directory: backend
        run: uv run ruff check app

      - name: Typecheck backend
        working-directory: backend
        run: uv run mypy --follow-imports=skip app/core app/outbox app/media app/db/migrate.py

      - name: Audit backend dependencies
        working-directory: backend
        run: uv export --frozen --no-dev --no-emit-project -o /tmp/backend-requirements.txt && uv run pip-audit -r /tmp/backend-requirements.txt

      - name: Verify backend
        working-directory: backend
        run: uv run pytest tests -q --cov=app --cov-report=term-missing --cov-fail-under=60

      - name: Verify frontend
        working-directory: frontend
        run: npm test

      - name: Typecheck frontend
        working-directory: frontend
        run: npx --no-install tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build and smoke-test API container
        run: |
          docker build -t koprik-api-ci backend
          docker run -d --name koprik-api-ci -p 18000:8000 \
            --add-host host.docker.internal:host-gateway \
            -e KOPRIK_ENVIRONMENT=test \
            -e KOPRIK_DATABASE_URL=postgresql+asyncpg://koprik:koprik@host.docker.internal:5432/koprik \
            -e KOPRIK_REDIS_URL=redis://host.docker.internal:6379/0 \
            koprik-api-ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs koprik-api-ci
          exit 1

      - name: Guard legacy monolith absence
        run: |
          python - <<'PY'
          from pathlib import Path

          forbidden = [
              "main.py",
              "api.py",
              "database.py",
              "cutover_app.py",
              "admin",
              "static",
              "tests",
              "Procfile",
              "railpack.json",
              "nixpacks.toml",
              "requirements.txt",
          ]
          found = [item for item in forbidden if Path(item).exists()]
          if found:
              raise SystemExit("Legacy monolith files returned: " + ", ".join(found))
          print("Legacy monolith absence: PASS")
          PY
