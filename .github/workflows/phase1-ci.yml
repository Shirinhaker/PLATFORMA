name: phase3-legacy-ui-integration

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff==0.16.3

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      # Qo'riqchi qarzni `origin/main` bilan solishtiradi, shuning uchun
      # o'sha shox mavjud bo'lishi kerak. `actions/checkout` standart
      # holatda faqat bitta commit oladi.
      - name: Fetch main for the length ratchet
        run: git fetch --no-tags --depth=1 origin main

      # Qarz faqat kamayadi: fayl ham, funksiya ham chegaradan oshmasin;
      # allaqachon oshgani esa o'smasin. Batafsil: scripts/check_file_length.py
      - name: Length ratchet
        run: python scripts/check_file_length.py

      # Hujjatdagi hajm raqamlari qo'lda yozilsa, birinchi refaktordayoq
      # eskiradi. Batafsil: scripts/update_architecture_stats.py
      - name: Architecture stats freshness
        run: python scripts/update_architecture_stats.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Prettier check
        working-directory: frontend
        run: npm run format:check

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: koprik
          POSTGRES_PASSWORD: koprik
          POSTGRES_DB: koprik
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koprik -d koprik"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      KOPRIK_ENVIRONMENT: test
      KOPRIK_DATABASE_URL: postgresql+asyncpg://koprik:koprik@localhost:5432/koprik
      KOPRIK_TEST_DATABASE_URL: postgresql+asyncpg://koprik:koprik@localhost:5432/koprik
      KOPRIK_REDIS_URL: redis://localhost:6379/0
      KOPRIK_OTP_SECRET: ci-otp-secret
      KOPRIK_CSRF_SECRET: ci-csrf-secret
      KOPRIK_TELEGRAM_WEBHOOK_SECRET: ci-webhook-secret
      KOPRIK_OUTBOX_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: python -m pip install -e "./backend[test]"

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Apply database migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Verify backend
        working-directory: backend
        run: python -m pytest tests -q

      - name: Verify frontend
        working-directory: frontend
        run: npm test

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Guard legacy monolith absence
        run: |
          python - <<'PY'
          from pathlib import Path

          forbidden = [
              "main.py",
              "api.py",
              "database.py",
              "cutover_app.py",
              "admin",
              "static",
              "tests",
              "Procfile",
              "railpack.json",
              "nixpacks.toml",
              "requirements.txt",
          ]
          found = [item for item in forbidden if Path(item).exists()]
          if found:
              raise SystemExit("Legacy monolith files returned: " + ", ".join(found))
          print("Legacy monolith absence: PASS")
          PY