name: modular-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: koprik
          POSTGRES_PASSWORD: koprik
          POSTGRES_DB: koprik
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koprik -d koprik"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      KOPRIK_ENVIRONMENT: test
      KOPRIK_DATABASE_URL: postgresql+asyncpg://koprik:koprik@localhost:5432/koprik
      KOPRIK_TEST_DATABASE_URL: postgresql+asyncpg://koprik:koprik@localhost:5432/koprik
      KOPRIK_REDIS_URL: redis://localhost:6379/0
      KOPRIK_OTP_SECRET: ci-otp-secret
      KOPRIK_CSRF_SECRET: ci-csrf-secret
      KOPRIK_TELEGRAM_WEBHOOK_SECRET: ci-webhook-secret
      KOPRIK_OUTBOX_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: python -m pip install -e "./backend[test]"

      - name: Verify Python dependencies
        run: python -m pip check

      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app migrations

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Audit production frontend dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Apply database migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Verify backend
        working-directory: backend
        run: python -m pytest tests -q

      - name: Verify frontend
        working-directory: frontend
        run: npm test

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build backend production image
        run: docker build --pull=false -t koprik-api-ci ./backend

      - name: Guard legacy monolith absence
        run: |
          python - <<'PY'
          from pathlib import Path

          forbidden = [
              "main.py",
              "api.py",
              "database.py",
              "cutover_app.py",
              "admin",
              "static",
              "tests",
              "Procfile",
              "railpack.json",
              "nixpacks.toml",
              "requirements.txt",
          ]
          found = [item for item in forbidden if Path(item).exists()]
          if found:
              raise SystemExit("Legacy monolith files returned: " + ", ".join(found))
          print("Legacy monolith absence: PASS")
          PY
