name: tmp-pr130-real-v1656-fix

on:
  push:
    branches:
      - fix/business-cabinet-v1656-parity

permissions:
  contents: write

jobs:
  fix-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/business-cabinet-v1656-parity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply real v1656 dashboard parity patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, got {count}\n---OLD---\n{old[:500]}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = 'frontend/src/profiles/BusinessProfileV3.tsx'

          replace_once(path,
          '''  | "education-statistics"\n  | "settings";''',
          '''  | "education-statistics"\n  | "admin"\n  | "settings";''')

          replace_once(path,
          '''  const onlineLabels: Record<string, string> = {\n    profile: "Profil ma’lumotlari",\n    subscriptions: "Obuna va tarifim",\n    payments: "To‘lovlar",\n    items: "Mahsulot / Xizmatlar",\n    orders: "Buyurtmalarim",\n    "service-orders": "Xizmat buyurtmalari",\n    messages: "Suhbatlar",\n    reviews: "Mijoz fikrlari",\n    advertisements: "Reklamalarim",\n    stories: "Istoriyalar",\n    notifications: "Bildirishnomalar",\n  };\n  const onlineOrder = [\n    "profile",\n    "subscriptions",\n    "payments",\n    "items",\n    "dining-places",\n    "medical-providers",\n    "medical-queue",\n    "education-enrollments",\n    "orders",\n    "service-orders",\n    "messages",\n    "reviews",\n    "advertisements",\n    "stories",\n    "notifications",\n  ];\n  const onlineMenuCards = onlineOrder\n    .map((view) => onlineMenus.find((menu) => menu.view === view))\n    .filter((menu): menu is Menu => Boolean(menu))\n    .map((menu) => ({ ...menu, label: onlineLabels[menu.view] ?? menu.label }));''',
          '''  const onlineOrder = [\n    "profile",\n    "subscriptions",\n    "payments",\n    "items",\n    "dining-places",\n    "medical-providers",\n    "medical-queue",\n    "education-enrollments",\n    "orders",\n    "service-orders",\n    "messages",\n    "reviews",\n    "advertisements",\n    "stories",\n    "notifications",\n  ];\n  // `visibleMenus` allaqachon v1656 yo'nalish label'larini qo'llaydi.\n  // Bu yerda qayta nomlash monolitdagi aniq matnlarni buzmasligi kerak.\n  const onlineMenuCards = onlineOrder\n    .map((view) => onlineMenus.find((menu) => menu.view === view))\n    .filter((menu): menu is Menu => Boolean(menu));''')

          replace_once(path,
          '''  const systemCard = (menus: Menu[], view: string, label: string): Menu | null => {\n    const menu = menus.find((candidate) => candidate.view === view);\n    return menu ? { ...menu, label } : null;\n  };\n  const baseSystemCards: Array<Menu | null> = [\n    systemCard(systemMenus, "sales", "Kassa"),\n    systemCard(systemMenus, "statistics", "Kassa tahlili"),\n    systemCard(onlineMenus, "medical-queue", "Navbat"),\n    systemCard(adminMenus, "staff", "Xodimlar"),\n    systemCard(onlineMenus, "orders", "Buyurtmalar"),\n    systemCard(systemMenus, "warehouse", "Ombor"),\n    systemCard(systemMenus, "expenses", "Xarajatlar"),\n    systemCard(systemMenus, "debtors", "Qarz"),\n    systemCard(onlineMenus, "stories", "Istoriyalar"),\n    systemCard(adminMenus, "documents", "Hujjatlar"),\n  ];\n  const representedSystemViews = new Set(\n    baseSystemCards.filter((menu): menu is Menu => Boolean(menu)).map((menu) => menu.view),\n  );\n  const inlineDirectionMenus = directionMenus.filter(\n    (menu) => !representedSystemViews.has(menu.view),\n  );\n  const systemMenuCards: Menu[] = [\n    ...baseSystemCards.filter((menu): menu is Menu => Boolean(menu)),\n    ...inlineDirectionMenus,\n    ...[\n      systemCard(systemMenus, "ai-assistant", "AI yordamchi"),\n      systemCard(systemMenus, "settings", "Ma’muriyat"),\n    ].filter((menu): menu is Menu => Boolean(menu)),\n  ];''',
          '''  const systemCard = (menus: Menu[], view: string, label?: string): Menu | null => {\n    const menu = menus.find((candidate) => candidate.view === view);\n    return menu ? { ...menu, ...(label ? { label } : {}) } : null;\n  };\n  const baseSystemCards: Array<Menu | null> = [\n    systemCard(systemMenus, "sales", "Kassa"),\n    systemCard(systemMenus, "expenses", "Xarajatlar"),\n    systemCard(systemMenus, "debtors", "Qarz daftari"),\n    systemCard(systemMenus, "warehouse", "Ombor"),\n    systemCard(systemMenus, "statistics", "Statistika"),\n  ];\n  const representedSystemViews = new Set(\n    baseSystemCards.filter((menu): menu is Menu => Boolean(menu)).map((menu) => menu.view),\n  );\n  const inlineDirectionMenus = directionMenus.filter(\n    (menu) => !representedSystemViews.has(menu.view),\n  );\n  const adminHubMenu: Menu | null = adminMenus.length ? {\n    icon: "🛡️",\n    label: "Ma'muriyat",\n    caption: "Xodimlar va hujjatlar",\n    view: "admin",\n  } : null;\n  const systemMenuCards: Menu[] = [\n    ...baseSystemCards.filter((menu): menu is Menu => Boolean(menu)),\n    ...inlineDirectionMenus,\n    ...[\n      systemCard(systemMenus, "ai-assistant", "AI yordamchi"),\n      adminHubMenu,\n      identity.actor_type !== "staff"\n        ? systemCard(systemMenus, "settings", "Sozlamalar")\n        : null,\n    ].filter((menu): menu is Menu => Boolean(menu)),\n  ];''')

          replace_once(path,
          '''  function openMenu(menu: Menu) {\n    if (menu.view === "settings") {''',
          '''  function openMenu(menu: Menu) {\n    if (menu.view === "admin") {\n      setScreen("admin");\n      return;\n    }\n    if (menu.view === "settings") {''')

          replace_once(path,
          '''    return withActionBanner(\n      <BusinessOnlineScreen\n        api={api}''',
          '''    const advertisingMenus = visibleMenus(profile, ONLINE_MENUS, identity);\n    const advertisementsMenu = advertisingMenus.find(\n      (menu) => menu.view === "advertisements",\n    );\n    const listingsMenu = advertisingMenus.find((menu) => menu.view === "listings");\n    const advertisingHub = ["advertisements", "listings"].includes(onlineMenu.view);\n    return withActionBanner(\n      <>\n        {advertisingHub ? (\n          <div className="ad-tabs" data-ad-tabs="business">\n            <button\n              type="button"\n              className={onlineMenu.view === "advertisements" ? "ad-tab on" : "ad-tab"}\n              disabled={!advertisementsMenu}\n              onClick={() => advertisementsMenu && setOnlineMenu(advertisementsMenu)}\n            >\n              Reklamalarim\n            </button>\n            <button\n              type="button"\n              className={onlineMenu.view === "listings" ? "ad-tab on" : "ad-tab"}\n              disabled={!listingsMenu}\n              onClick={() => listingsMenu && setOnlineMenu(listingsMenu)}\n            >\n              E'lonlarim\n            </button>\n          </div>\n        ) : null}\n        <BusinessOnlineScreen\n        api={api}''')

          replace_once(path,
          '''          setOnlineMenu(null);\n          setScreen("cabinet");\n        }}\n      />,\n    );\n  }\n\n  if (screen === "data") {''',
          '''          setOnlineMenu(null);\n          setScreen("cabinet");\n        }}\n        />\n      </>,\n    );\n  }\n\n  if (screen === "admin") {\n    const menus = visibleMenus(profile, ADMIN_MENUS, identity);\n    return withActionBanner(\n      <main className="business-cabinet">\n        <section className="business-cabinet__panel">\n          <div className="business-cabinet__section-heading">\n            <div>\n              <h1>Ma'muriyat</h1>\n              <p>Xodimlar va hujjatlar</p>\n            </div>\n            <button\n              type="button"\n              aria-label="Kabinetga qaytish"\n              onClick={() => setScreen("cabinet")}\n            >\n              ← Kabinetga qaytish\n            </button>\n          </div>\n          <div className="business-cabinet__menu-grid">\n            {menus.map((menu) => (\n              <button\n                type="button"\n                key={`admin-${menu.view}`}\n                onClick={() => openMenu(menu)}\n              >\n                <span>{menu.icon}</span>\n                <span><b>{menu.label}</b><small>{menu.caption}</small></span>\n              </button>\n            ))}\n          </div>\n        </section>\n      </main>,\n    );\n  }\n\n  if (screen === "data") {''')

          replace_once(path,
          '''      <StaffManagementV1656 api={api} onBack={() => setScreen("cabinet")} />,''',
          '''      <StaffManagementV1656 api={api} onBack={() => setScreen("admin")} />,''')

          replace_once(path,
          '''        onProfile={setProfile}\n        onBack={() => setScreen("cabinet")}\n      />,''',
          '''        onProfile={setProfile}\n        onBack={() => setScreen("admin")}\n      />,''')

          # New focused parity test: true v1656 visible labels and main-grid structure.
          test_path = 'frontend/src/profiles/BusinessCabinetDashboardParityV1656.test.tsx'
          replace_once(test_path,
          '''    expect(menuTexts(onlineSection as HTMLElement)).toEqual(expect.arrayContaining([\n      "Profil ma’lumotlari",\n      "Obuna va tarifim",\n      "To‘lovlar",\n      "Mahsulot / Xizmatlar",\n      "Buyurtmalarim",\n      "Xizmat buyurtmalari",\n      "Suhbatlar",\n      "Mijoz fikrlari",\n      "Reklamalarim",\n      "Istoriyalar",\n      "Bildirishnomalar",\n    ]));''',
          '''    expect(menuTexts(onlineSection as HTMLElement)).toEqual(expect.arrayContaining([\n      "Profil / Mening sahifam",\n      "Obunalarim",\n      "To‘lovlarim",\n      "Mahsulotlar",\n      "Buyurtmalar",\n      "Xizmat buyurtmalari",\n      "Suhbatlar",\n      "Mijoz fikrlari",\n      "Reklamalarim",\n      "Istoriya arxivi",\n      "Bildirishnomalarim",\n    ]));''')

          replace_once(test_path,
          '''    expect(menuTexts(systemSection as HTMLElement)).toEqual(expect.arrayContaining([\n      "Kassa",\n      "Kassa tahlili",\n      "Xodimlar",\n      "Buyurtmalar",\n      "Ombor",\n      "Xarajatlar",\n      "Qarz",\n      "Hujjatlar",\n      "AI yordamchi",\n      "Ma’muriyat",\n    ]));''',
          '''    expect(menuTexts(systemSection as HTMLElement)).toEqual(expect.arrayContaining([\n      "Kassa",\n      "Xarajatlar",\n      "Qarz daftari",\n      "Ombor",\n      "Statistika",\n      "AI yordamchi",\n      "Ma'muriyat",\n      "Sozlamalar",\n    ]));\n    expect(within(systemSection as HTMLElement).queryByRole("button", { name: /Xodimlar/ }))\n      .not.toBeInTheDocument();\n    expect(within(systemSection as HTMLElement).queryByRole("button", { name: /Hujjatlar/ }))\n      .not.toBeInTheDocument();''')

          # Profile editor card is the real monolith label.
          parity = 'frontend/src/profiles/BusinessProfileParity.test.tsx'
          replace_once(parity,
          '''    { name: /Profil ma’lumotlari/ },''',
          '''    { name: /Profil \/ Mening sahifam/ },''')
          replace_once(parity,
          '''    await user.click(await screen.findByRole("button", { name: /Xodimlar/ }));\n    expect(await screen.findByRole("heading", { name: "Xodimlar" }))''',
          '''    await user.click(await screen.findByRole("button", { name: /Ma'muriyat/ }));\n    await user.click(await screen.findByRole("button", { name: /Xodimlar/ }));\n    expect(await screen.findByRole("heading", { name: "Xodimlar" }))''')

          # Broad regression navigation: monolith uses nested ads/admin hubs.
          profiles = 'frontend/src/profiles/Profiles.test.tsx'
          replace_once(profiles,
          '''    expect(screen.getByText("Ma’muriyat")).toBeInTheDocument();''',
          '''    expect(screen.getByText("Ma'muriyat")).toBeInTheDocument();''')
          replace_once(profiles,
          '''    await user.click(await screen.findByRole("button", { name: /E’lonlarim/ }));\n\n    expect(await screen.findByText("Biznes e'loni")).toBeInTheDocument();''',
          '''    await user.click(await screen.findByRole("button", { name: /Reklamalarim/ }));\n    await user.click(await screen.findByRole("button", { name: /E'lonlarim/ }));\n\n    expect(await screen.findByText("Biznes e'loni")).toBeInTheDocument();''')
          replace_once(profiles,
          '''    await user.click(await screen.findByRole("button", { name: /Xodimlar/ }));\n    expect(await screen.findByText("Haqiqiy xodim")).toBeInTheDocument();\n    await user.click(screen.getByRole("button", { name: /Kabinetga qaytish/ }));\n    await user.click(screen.getByRole(\n      "button",\n      { name: /Mening hujjatlarim/ },\n    ));''',
          '''    await user.click(await screen.findByRole("button", { name: /Ma'muriyat/ }));\n    await user.click(await screen.findByRole("button", { name: /Xodimlar/ }));\n    expect(await screen.findByText("Haqiqiy xodim")).toBeInTheDocument();\n    await user.click(screen.getByRole("button", { name: /Kabinetga qaytish/ }));\n    await user.click(screen.getByRole(\n      "button",\n      { name: /Mening hujjatlarim/ },\n    ));''')
          replace_once(profiles,
          '''    await user.click(screen.getByRole("button", { name: /Orqaga/ }));\n    await user.click(screen.getByRole("button", { name: /Orqaga/ }));\n    const warehouseButtons = screen.getAllByRole("button", { name: /Ombor/ });''',
          '''    await user.click(screen.getByRole("button", { name: /Orqaga/ }));\n    await user.click(screen.getByRole("button", { name: /Orqaga/ }));\n    await user.click(screen.getByRole("button", { name: /Kabinetga qaytish/ }));\n    const warehouseButtons = screen.getAllByRole("button", { name: /Ombor/ });''')

          print('real v1656 parity patch applied')
          PY
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run focused cabinet tests
        working-directory: frontend
        run: npm test -- --run BusinessCabinetDashboardParityV1656.test.tsx BusinessProfileParity.test.tsx Profiles.test.tsx BusinessOnlineParity.test.tsx BusinessOnlineMutations.test.tsx BusinessOnlineEditing.test.tsx BusinessLocationPickerV1656Parity.test.tsx
      - name: Run full frontend test suite
        working-directory: frontend
        run: npm test -- --run
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Commit only after all gates pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-pr130-real-v1656-fix.yml
          git add frontend/src/profiles/BusinessProfileV3.tsx \
                  frontend/src/profiles/BusinessCabinetDashboardParityV1656.test.tsx \
                  frontend/src/profiles/BusinessProfileParity.test.tsx \
                  frontend/src/profiles/Profiles.test.tsx
          git diff --cached --check
          git commit -m "fix: align business cabinet with real v1656 dashboard"
          git push origin HEAD:fix/business-cabinet-v1656-parity
