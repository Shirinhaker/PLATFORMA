name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  # 1-VAZIFA: har bir PR ochilganda yoki yangilanganda avtomatik tekshiruv
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 80"
          prompt: |
            Bu PR'ni ko'rib chiq va natijani O'ZBEK TILIDA yoz.

            Loyiha konteksti:
            - PLATFORMA — FastAPI (Python) backend + React/TypeScript/Vite frontend.
            - Frontend testlari: vitest (`cd frontend && npm test`).
            - Maqsad: eski ishlab turgan monolit (static/index.html, v1656) bilan
              yangi React modullari orasida TO'LIQ PARITET saqlash.

            MUHIM — samarali ishla, qadamlarni tejab:
            - `static/index.html` 14 ming qatordan iborat. UNI TO'LIQ O'QIMA.
              Faqat kerakli qismini o'qi:
              `sed -n '8140,8390p' static/index.html`
              yoki `grep -n "cab-dining" static/index.html` bilan qatorni top.
            - PR tavsifida ko'rsatilgan qator oraliqlaridan foydalan.
            - Avval `git diff` bilan o'zgargan fayllarni ko'r, keyin faqat
              o'sha fayllarga tegishli etalon qismlarini tekshir.
            - Testlarni o'zing ishga tushirma — faqat kodni va test fayllarini o'qi.

            Quyidagilarni tekshir, faqat aniq muammolarni yoz:

            1. PARITET: matn, tugma nomlari, CSS klasslar, bo'sh holat
               xabarlari, tasdiqlash oynalari monolit bilan aynan bir xilmi?
               Farq bo'lsa fayl va qatorni ko'rsat.
            2. TESTLAR: test skip/o'chirilganmi, assert zaiflashtirilganmi,
               qoplama toraymaganmi?
            3. XAVFSIZLIK: o'chirish/tahrirlashda tasdiqlash bormi,
               validatsiya yetarlimi.
            4. REGRESSIYA: API shartnomalari, maydon nomlari, V7
               normalizatsiya mantig'i buzilmaganmi.
            5. Yo'nalishga moslashuv (CAB_PLANS / applyCabinetLayout) to'g'rimi.

            Mayda uslub e'tirozlarini yozma. Har kamchilikni
            "jiddiy / o'rtacha / kichik" deb belgila va tuzatish yo'lini ayt.
            Hammasi joyida bo'lsa, qisqa tasdiq yoz.

  # 2-VAZIFA: PR yoki issue ichida "@claude" deb yozilganda javob beradi
  mention:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 80"
