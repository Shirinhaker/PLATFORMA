<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Koprik — texnik ishlar</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; color: #16352f; background: #edf7f4; }
      main { display: grid; min-height: 100vh; padding: 24px; place-items: center; }
      section { width: min(560px, 100%); padding: 40px; border: 1px solid #c9e5df;
        border-radius: 24px; background: white; box-shadow: 0 20px 55px #12463b1a; }
      span { display: grid; width: 48px; height: 48px; place-items: center;
        border-radius: 14px; color: white; background: #117b68; font-weight: 800; }
      h1 { margin: 24px 0 12px; font-size: clamp(30px, 7vw, 48px); line-height: 1.05; }
      p { margin: 0; color: #526c66; font-size: 18px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <span>K</span>
        <h1>Texnik ishlar olib borilmoqda</h1>
        <p>Ma’lumotlarni xavfsiz ko‘chiryapmiz. Iltimos, birozdan keyin qayta kiring.</p>
      </section>
    </main>
  </body>
</html>
