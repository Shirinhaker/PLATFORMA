[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "koprik-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.139.2",
  "uvicorn[standard]==0.51.0",
  "httpx==0.28.1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "redis>=5,<8",
  "boto3>=1.35,<2",
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<47",
  "python-json-logger>=3,<4",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
  "fakeredis[lua]>=2.27,<3",
]

[project.scripts]
koprik-worker = "app.outbox.worker:main"
koprik-migrate-legacy = "app.legacy_migration.cli_v6:main"
koprik-migrate-complete-cabinets = "app.legacy_migration.cli_v6:main"

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
