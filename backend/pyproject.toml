[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "koprik-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.139.2",
  "uvicorn[standard]==0.51.0",
  "httpx==0.28.1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "redis>=5,<8",
  "boto3>=1.35,<2",
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<47",
  "python-json-logger>=3,<4",
  "firebase-admin==7.5.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
  "fakeredis[lua]>=2.27,<3",
  # Qoplamani o'lchash uchun. Hisobot: docs/qoplama-hisoboti.md
  "pytest-cov>=6,<8",
]

[project.scripts]
koprik-worker = "app.outbox.worker:main"
koprik-migrate-legacy = "app.legacy_migration.cli_v9:main"
koprik-migrate-complete-cabinets = "app.legacy_migration.cli_v9:main"
koprik-migrate-late-domains = "app.legacy_migration.late_domains_v9:main"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
  "E501",    # qator uzunligini formatter hal qiladi
  "B008",    # FastAPI Depends() default argumentda ishlatiladi
  "RUF001",  # o'zbekcha matnlarda kirill/lotin belgilar aralashuvi
  "RUF002",
  "RUF003",

  # --- VAQTINCHA: qoldiq. Har birini alohida PR bilan tuzatib,
  # --- shu ro'yxatdan o'chirib boring. Yangi kod bularni buzmasligi kerak.
  "RUF005",  # 1
  "RUF036",  # 1  — None union oxirida emas
  "RUF046",  # 4  — keraksiz int() konversiyasi
  "RUF059",  # 1
  "SIM103",  # 2
  "SIM105",  # 10 — contextlib.suppress ishlatish mumkin
  "SIM115",  # 2  — open() context manager'siz
  "SIM117",  # 2  — ichma-ich with
  "UP031",   # 8  — eski % formatlash
  "UP042",   # 10 — str + Enum o'rniga StrEnum
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# Bosqichma-bosqich qat'iylashtiriladi:
# disallow_untyped_defs = true
exclude = ["migrations/", "app/legacy_migration/"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
