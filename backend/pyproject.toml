[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "koprik-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.139.2",
  "uvicorn[standard]==0.52.1",
  "httpx==0.28.1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "redis>=8.1.0,<9",
  "boto3>=1.35,<2",
  "argon2-cffi>=23.1,<26",
  "cryptography>=50,<51",
  "python-json-logger>=3,<4",
  "firebase-admin==7.5.0",
  "prometheus-client==0.26.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov==7.0.0",
  "fakeredis[lua]>=2.37,<3",
  "mypy==1.17.1",
  "ruff==0.16.2",
  "pip-audit==2.9.0",
]

[project.scripts]
koprik-worker = "app.outbox.worker:main"

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = ["app/legacy_migration/"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
