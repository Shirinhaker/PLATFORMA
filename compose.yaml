services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: koprik
      POSTGRES_PASSWORD: koprik
      POSTGRES_DB: koprik
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koprik -d koprik"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - koprik_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - koprik_redis:/data

  api:
    build:
      context: ./backend
    environment:
      KOPRIK_ENVIRONMENT: development
      KOPRIK_DATABASE_URL: postgresql+asyncpg://koprik:koprik@postgres:5432/koprik
      KOPRIK_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.outbox.worker"]
    environment:
      KOPRIK_ENVIRONMENT: development
      KOPRIK_DATABASE_URL: postgresql+asyncpg://koprik:koprik@postgres:5432/koprik
      KOPRIK_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  koprik_postgres:
  koprik_redis:
